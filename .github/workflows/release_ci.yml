name: RELEASE_CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Java Configuration
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify release tag matches project version
        run: |
          bash ./scripts/set-version.sh --check
          expected_tag="$(bash ./scripts/set-version.sh --print-tag)"
          if [ "$expected_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION tag $expected_tag"
            exit 1
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            gcc-mingw-w64-x86-64

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Dependencies
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar -O bundletool.jar
          
          echo '#!/bin/bash' | sudo tee /usr/local/bin/bundletool
          echo "java -jar $PWD/bundletool.jar \"\$@\"" | sudo tee -a /usr/local/bin/bundletool
          sudo chmod +x /usr/local/bin/bundletool

      - name: Prepare Keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/rockpload.keystore

      - name: Build with Script
        env:
          ROCKPLOAD_VERSION: ${{ github.ref_name }}
          BUILD_ANDROID: "true"
          ANDROID_APP_BUILD: ${{ github.run_number }}
          ROCKPLOAD_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ROCKPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ROCKPLOAD_SIGNED: "true"
        run: |
          chmod +x ./scripts/build.sh
          chmod +x ./scripts/build-android.sh
          ./scripts/build.sh

      - name: Extracting Signed Universal APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bundletool build-apks \
            --bundle=Rockpload.aab \
            --output=Rockpload.apks \
            --mode=universal \
            --ks=keystore/rockpload.keystore \
            --ks-pass=pass:$KEYSTORE_PASS \
            --ks-key-alias=$KEY_ALIAS \
            --key-pass=pass:$KEYSTORE_PASS
            
          unzip Rockpload.apks -d apks_dir
          mv apks_dir/universal.apk releases/rockpload_${{ github.ref_name }}-android.apk

      - name: Check generated files
        run: |
          ls -lh releases/
          [ "$(ls -A releases/)" ] || (echo "Error: No generated file" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            releases/rockpload_*

      - name: Update stable branch
        if: ${{ !contains(github.ref_name, '-') }}
        run: git push origin HEAD:refs/heads/stable --force

      - name: Update beta branch
        if: ${{ contains(github.ref_name, '-') }}
        run: git push origin HEAD:refs/heads/beta --force

  build-ios-release:
    runs-on: macos-latest
    needs: build-and-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release tag matches project version
        run: |
          bash ./scripts/set-version.sh --check
          expected_tag="$(bash ./scripts/set-version.sh --print-tag)"
          if [ "$expected_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION tag $expected_tag"
            exit 1
          fi

      - name: Install Fyne
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build with Script
        env:
          ROCKPLOAD_VERSION: ${{ github.ref_name }}
          BUILD_IOS: "true"
          IOS_APP_BUILD: ${{ github.run_number }}
        run: |
          chmod +x ./scripts/build-ios.sh
          go generate
          ./scripts/build.sh

      - name: Check generated files
        run: |
          ls -lh releases/
          [ "$(ls -A releases/)" ] || (echo "Error: No generated file" && exit 1)

      - name: Upload iOS Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            releases/rockpload_*-ios.ipa

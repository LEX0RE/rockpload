name: RELEASE_CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify release tag matches project version
        run: |
          bash ./scripts/set-version.sh --check
          expected_tag="$(bash ./scripts/set-version.sh --print-tag)"
          if [ "$expected_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION tag $expected_tag"
            exit 1
          fi

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev \
            gcc-mingw-w64-x86-64

      - name: Build with Script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh
        env:
          ROCKPLOAD_VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            releases/rockpload_*

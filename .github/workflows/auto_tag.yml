name: AUTO_TAG

on:
  push:
    branches:
      - master
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      created: ${{ steps.compute.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute and push tag
        id: compute
        run: |
          bash ./scripts/set-version.sh --check
          tag="$(bash ./scripts/set-version.sh --print-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release_ci.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
